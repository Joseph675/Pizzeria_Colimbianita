<div class="login-container">
  <!-- Background -->
  <div class="bg"></div>
  <div class="grain"></div>

 

  <!-- Left branding -->
  <div class="brand-panel">
    <div class="brand-name" style="font-family: DM Serif Display;">Pizzeria<span></span><br>Colombianita</div>
    <div class="brand-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Card -->
  <div class="card-wrap">
    <div class="card">
      <div class="card-header">
        <p class="card-eyebrow">Bienvenido de vuelta</p>
        <h1 class="card-title">Inicia <em>sesión</em></h1>
      </div>

      <!-- Tabs -->
      <div class="tabs" id="tabs">
        <button class="tab-btn active">Iniciar sesión</button>
      </div>

      <!-- LOGIN PANEL -->
      <div class="panel active" id="login">
        <form (ngSubmit)="login()">
          <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" placeholder="tu@correo.com" [(ngModel)]="email" name="email" required autocomplete="username" />
            <span class="input-icon">✉</span>
          </div>
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" placeholder="••••••••" [(ngModel)]="password" name="password" required autocomplete="current-password" />
            <span class="input-icon">🔒</span>
          </div>

          <div class="options-row">
            <label class="remember">
              <input type="checkbox" /> Recordarme
            </label>
            <a href="#" class="forgot">¿Olvidaste tu clave?</a>
          </div>

          <button class="btn-primary" type="submit">Entrar ahora →</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Contenedor de Toasts de CoreUI -->
<div style="position: fixed; top: 0; right: 0; z-index: 99999; pointer-events: none; width: 100%; height: 100%;">
  <c-toaster [placement]="position" class="p-3" position="absolute" style="pointer-events: auto;">
    <c-toast *ngFor="let toast of toasts" [visible]="true" [color]="toast.type" class="text-white align-items-center border-0 shadow-lg mb-2">
      <div class="d-flex">
        <c-toast-body style="font-weight: 500; font-size: 0.95rem;">{{ toast.message }}</c-toast-body>
        <button cButtonClose class="me-2 m-auto" white (click)="removeToast(toast.id)"></button>
      </div>
    </c-toast>
  </c-toaster>
</div>
