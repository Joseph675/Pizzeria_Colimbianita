<!-- ══════ TOP NAVBAR ══════ -->
<nav class="topbar">
  <!-- Hamburger (solo móvil) -->
  <button class="hamburger-btn" (click)="onToggleSidebar()" aria-label="Abrir menú">
    <span></span><span></span><span></span>
  </button>

  <!-- Logo -->
  <a routerLink="/" class="tb-logo">
    <div class="logo-icon" style="background-image: url('assets/icon.png'); background-size: contain; background-position: center; background-repeat: no-repeat; background-color: transparent; width: 48px; height: 48px; box-shadow: none;"></div>
    <span class="logo-text">Pizzeria<span></span> Colombianita</span>
  </a>

 
  <div class="tb-spacer"></div>



 

  <!-- Actions -->
  <div class="tb-actions">
    <!-- Botón Cambio de Tema (Claro/Oscuro) -->
    <button class="icon-btn" style="margin-right: 0.5rem;" (click)="colorMode.set(colorMode() === 'dark' ? 'light' : 'dark')" title="Cambiar Tema">
      <!-- Icono de Sol (Para cambiar a claro) -->
      <svg *ngIf="colorMode() === 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <!-- Icono de Luna (Para cambiar a oscuro) -->
      <svg *ngIf="colorMode() !== 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <!-- Notifications -->
    <div class="notification-wrapper">
      <!-- Botón de la campana -->
      <button class="notification-btn" (click)="toggleNotifications()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bell-icon">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notification-badge" *ngIf="alertasNoLeidas.length > 0">{{ alertasNoLeidas.length }}</span>
      </button>

      <!-- Dropdown de Notificaciones -->
      <div class="notification-dropdown" [class.show]="showNotifications">
        <div class="nd-header">
          <h6>Alertas de Inventario</h6>
          <button class="mark-read-btn" *ngIf="alertasNoLeidas.length > 0" (click)="marcarComoLeidas()">Marcar como leídas</button>
        </div>
        <div class="nd-body">
          <div class="nd-empty" *ngIf="alertasNoLeidas.length === 0">No hay alertas nuevas.</div>
          <div class="nd-item" *ngFor="let alerta of alertasNoLeidas">
            <div class="nd-icon">⚠️</div>
            <div class="nd-content">
              <div class="nd-title">{{ alerta.mensaje || 'Stock crítico detectado' }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <ng-container *ngTemplateOutlet="userDropdown" />
  </div>
</nav>

<ng-template #userDropdown>
  <c-dropdown [popperOptions]="{ placement: 'bottom-end' }">
    <!-- Admin user (Utiliza el toggle de CoreUI adaptado al mockup) -->
    <div class="admin-user" cDropdownToggle [caret]="false">
      <div class="av">AD</div>
      <div class="user-info">
        <div class="user-name">{{ userName || 'Admin' }}</div>
        <div class="user-role">{{ userRol || 'Admin' }}</div>
      </div>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </div>

    <ul cDropdownMenu class="pt-0 w-auto custom-dropdown">
      <h6 class="text-center py-2" style="margin-top: 8px; color: #fff;">{{ userName || 'Admin' }}</h6>
      <li><hr cDropdownDivider class="custom-divider"/></li>
      <li>
        <a cDropdownItem  class="custom-dropdown-item">
          <svg cIcon class="me-2" name="cilUser" style="width: 16px;"></svg> Profile
        </a>
      </li>
      <li><hr cDropdownDivider class="custom-divider"/></li>
      <li>
        <a cDropdownItem href="javascript:void(0)" (click)="logout()" class="custom-dropdown-item text-danger">
          <svg cIcon class="me-2" name="cilAccountLogout" style="width: 16px;"></svg> Logout
        </a>
      </li>
    </ul>
  </c-dropdown>
</ng-template>
