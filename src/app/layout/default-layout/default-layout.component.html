<div class="bg"></div>
<div class="grain"></div>

<!-- Backdrop móvil -->
<div class="sidebar-backdrop" [class.show]="sidebarOpen" (click)="closeSidebar()"></div>

<!-- ══════ TOP NAVBAR ══════ -->
<app-default-header (toggleSidebar)="toggleSidebar()"></app-default-header>

<!-- ══════ SIDEBAR ══════ -->
<aside class="sidebar"
  [style.transform]="isMobile ? (sidebarOpen ? 'translateX(0)' : 'translateX(-100%)') : null"
  [style.transition]="isMobile ? 'transform .28s cubic-bezier(.4,0,.2,1)' : null"
  [style.z-index]="isMobile ? '99999' : null"
  [style.animation]="isMobile ? 'none' : null"
  [style.box-shadow]="isMobile && sidebarOpen ? '6px 0 40px rgba(0,0,0,.8)' : null">
  
  <!-- El sidebar dinamico renderizado desde _nav.ts -->
  <app-custom-sidebar-nav [navItems]="navItems"></app-custom-sidebar-nav>

  <div class="sidebar-footer">
    <a href="javascript:void(0)" class="side-link danger" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Cerrar sesión
    </a>
  </div>
</aside>

<!-- ══════ MAIN CONTENT ══════ -->
<main class="main">
  <router-outlet></router-outlet>
</main>
